<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donna's Space — Family Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Geist+Mono:wght@400,500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="css/styles.css?v=20260812-fam">
<link rel="stylesheet" href="css/person-space.css">
</head>
<body class="person-space-body" style="--space-accent:#00C2CC">

<header class="site-nav" data-family-nav></header>

<div id="auth-loading" class="loading-state">Loading Donna's Space</div>

<div id="passcode-gate" class="gate-overlay" hidden>
  <div class="gate-card surface">
    <i class="ph-duotone ph-duotone-heartbeat gate-emoji" aria-hidden="true"></i>
    <h2 class="gate-title">Donna's Space</h2>
    <p class="gate-sub">Enter the family passcode</p>
    <div class="gate-inputs" id="gate-inputs">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="gate-digit" autocomplete="off" aria-label="Passcode digit 1">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="gate-digit" autocomplete="off" aria-label="Passcode digit 2">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="gate-digit" autocomplete="off" aria-label="Passcode digit 3">
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="gate-digit" autocomplete="off" aria-label="Passcode digit 4">
    </div>
    <p class="gate-error" id="gate-error" hidden>Wrong code — try again</p>
    <button class="btn btn-primary" id="gate-submit">Unlock</button>
  </div>
</div>

<main id="person-space-root" class="person-space-shell" hidden>
  <section class="person-space-hero" aria-labelledby="space-title">
    <span class="person-space-icon"><i class="ph-duotone ph-duotone-heartbeat" aria-hidden="true"></i></span>
    <p class="person-space-kicker">Family Space</p>
    <h1 class="person-space-title" id="space-title">Donna</h1>
    <p class="person-space-intro">Donna's home for study tools, personal projects, and future features.</p>
  </section>

  <section class="person-features" aria-labelledby="features-title">
    <p class="person-features-label" id="features-title">Donna's features</p>
    <div class="person-feature-grid">
      <a class="person-feature-card" href="study.html">
        <i class="ph-duotone ph-duotone-heartbeat" aria-hidden="true"></i>
        <h2>Study Zone</h2>
        <p>NCLEX-PN prep with daily goals, quiz sets, videos, and notes.</p>
      </a>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer" hidden>
  <span class="footer-text">Donna's Space · Family Hub</span>
  <button class="footer-link-btn" id="lock-btn"><i class="ph-duotone ph-duotone-lock-simple" aria-hidden="true"></i> Lock this device</button>
</footer>

<script type="module" src="js/person-space.js"></script>
<script src="js/nav.js?v=20260812-fam"></script>
</body>
</html>
